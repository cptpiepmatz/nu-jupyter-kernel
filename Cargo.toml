[package]
name = "nu-jupyter-kernel"
version = "0.1.16+0.117.0"
edition.workspace = true
description = "A jupyter raw kernel for nu"
repository.workspace = true
license.workspace = true
keywords = ["jupyter-kernel", "jupyter", "nushell"]
categories = ["science"]

[workspace.package]
edition = "2024"
repository = "https://github.com/cptpiepmatz/nu-jupyter-kernel"
license = "MIT"

[package.metadata.jupyter]
protocol_version = "5.4"

[features]
default = ["plotting"]
plotting = ["nu-plotters"]

[workspace]
members = ["crates/nu_plugin_plotters"]

[workspace.dependencies]
nu-cmd-extra = "0.117.0"
nu-cmd-lang = "0.117.0"
nu-cmd-plugin = "0.117.0"
nu-config = "0.117.0"
nu-command = { version = "0.117.0", features = ["plugin"] }
nu-engine = { version = "0.117.0" }
nu-parser = { version = "0.117.0", features = ["plugin"] }
nu-protocol = { version = "0.117.0", features = ["plugin"] }
nu-plugin = { version = "0.117.0", default-features = false }

# plotting
[dependencies.nu-plotters]
package = "nu_plugin_plotters"
version = "0.2.6"
path = "crates/nu_plugin_plotters"
optional = true

[dependencies]
# nu
nu-cmd-extra.workspace = true
nu-cmd-lang.workspace = true
nu-cmd-plugin.workspace = true
nu-config.workspace = true
nu-command.workspace = true
nu-engine.version = "0.117.0"  # cannot publish if this inherits from workspace
nu-parser.workspace = true
nu-protocol.workspace = true

# Cryptography and Security
hmac = "0.13.0"
sha2 = "0.11.2"

# Data Handling and Serialization
bytes = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = "1.29.3"

# Date and Time
chrono = "0.4.45"

# Derive Macros
clap = { version = "4.6.10", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
strum = { version = "0.28.0", features = ["derive"] }

# Error Handling
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy"] }

# Filesystem
dirs = "7.0.0"
# fff-notify-debouncer-full 0.9.4 is incompatible with notify 9.0.0's API changes.
notify = "=9.0.0-rc.4"

# Formatting and Utilities
const_format = "0.2.37"
hex = "0.4.3"
indoc = "2.0.8"

# Media and Configuration Types
mime = "0.3.18"
mime_guess = "2.0.5"
static-toml = "1.3.0"

# Networking and IPC
os_pipe = { version = "1.2.3", features = ["io_safety"] }
zeromq = "0.7.0"

# Synchronization and Concurrency
parking_lot = "0.13.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "parking_lot"] }

# Miscellaneous
atomic_enum = "0.3.0"
