[package]
name = "nu_plugin_plotters"
description = "A nushell plugin for for plotting charts"
version = "0.2.6+0.117.0"
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# nu
nu-plugin.workspace = true
nu-protocol.workspace = true
nu-engine.workspace = true

# plotting
plotters = "0.3.7"

# dates
chrono = "0.4.45"

# serialization, needed for custom values
serde = { version = "1.0.229", features = ["derive"] }
typetag = "0.2.23"

# drawing to the terminal
icy_sixel = "0.7.0"
viuer = "0.11.0"
image = "0.25.10"

# misc
mime2 = "0.1.7"
